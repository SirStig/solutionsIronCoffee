<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- react-helmet-async writes title, description, canonical, OG and JSON-LD
         per route; the prerender step bakes them into each static page. -->
    <title>Joshua Kac, Software Engineer</title>
    <meta name="description" content="Software engineer building apps people actually use. Currently shipping Beyond25, an AI music curator on iOS, Android and web." />

    <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/rss+xml" title="Writing by Joshua Kac" href="/rss.xml" />

    <!--
      Self-hosted, so no third-party connection is needed before text paints.

      Warmed rather than preloaded. Inter is 71 KB, which is a second and a half
      of a bad cellular connection, and a preload puts that ahead of the image
      or the heading that is usually the largest element on the page. It does
      not need to be: `Inter fallback` in tokens.css is metric-matched to it, so
      text paints immediately in a local face at the right size and swaps with
      no reflow and no layout shift.

      The demo pages preload their own display face instead, from
      scripts/prerender.mjs. Those are not metric-matched to anything, so a
      late swap there really would move the page about.
    -->
    <link rel="preconnect" href="/" />

    <script>
      // Resolves the theme before first paint so a dark-mode load never
      // flashes white. ThemeContext reads whatever this sets.
      (function () {
        try {
          var stored = localStorage.getItem('ic-theme');
          var mode =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
