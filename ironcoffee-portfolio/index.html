<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- react-helmet-async writes title, description, canonical, OG and JSON-LD
         per route; the prerender step bakes them into each static page. -->
    <title>Joshua Kac — Software Engineer</title>
    <meta name="description" content="Software engineer building apps people actually use. Currently shipping Beyond25, an AI music curator on iOS, Android and web." />

    <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/rss+xml" title="Joshua Kac — Writing" href="/rss.xml" />

    <!-- Self-hosted, so no third-party connection is needed before text paints. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Runs before first paint. Resolves the theme so a dark-mode load never
      // flashes white, and marks that scripting is available — reveal-on-scroll
      // is opt-in from this class, so content stays visible without JavaScript
      // instead of being stuck at opacity 0.
      (function () {
        document.documentElement.classList.add('js');
        try {
          var stored = localStorage.getItem('ic-theme');
          var mode =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
